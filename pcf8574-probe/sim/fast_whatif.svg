<text class="s" x="650" y="640" text-anchor="middle">Every pin of the expander that a bus line reaches has 10 pF and protection diodes to the expander's own supply and ground.</text>
<text class="s" x="650" y="660" text-anchor="middle">Each track is an inductance, estimated from its length and width; 150 Ω across each stands in for its losses. Coupling between tracks is not modelled.</text>
<text class="t" x="650" y="690" text-anchor="middle">Circuit of the fast what-if simulation (sim/fast_whatif.cir). The pulse is assumed, not measured.</text>
